# H2 Database Configuration
spring.sql.init.platform=h2
spring.datasource.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Change to 'validate' in production
spring.jpa.hibernate.ddl-auto=update
# Desabilitado para evitar overhead de I/O durante medição de latência k6
spring.jpa.show-sql=false

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── HikariCP — tuning para carga k6 ─────────────────────────────────────────
# Pool de 25 conexões suporta picos de VUs concorrentes sem queue starvation.
# Fórmula de referência: pool_size = (core_count * 2) + disk_spindles
# Ajustado para ambiente de TCC (4–8 cores): 25 cobre folga de segurança.
spring.datasource.hikari.maximum-pool-size=25

# Mínimo de 5 conexões "quentes" mantidas abertas para evitar custo de
# handshake JDBC no início das ondas de carga k6.
spring.datasource.hikari.minimum-idle=5

# Timeout de 30 s para aquisição de conexão — falha rápida em vez de
# acumular requisições na fila (evita cascata de timeouts).
spring.datasource.hikari.connection-timeout=30000

# Tempo máximo de vida de uma conexão (10 min) — reduz risco de conexões
# expiradas por timeout do H2.
spring.datasource.hikari.max-lifetime=600000

# Tempo de keepalive para detectar conexões mortas (2 min).
spring.datasource.hikari.keepalive-time=120000
